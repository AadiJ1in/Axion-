name: RC1 browser E2E

on:
  push:
    branches:
      - feature/rc1-session-identity
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner for RC1 bootstrap
        run: npm install --no-save @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static and unit regression suite
        run: npm run check
      - name: RC1 browser critical paths
        run: npx playwright test
