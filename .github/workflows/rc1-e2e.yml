name: RC1 browser E2E

on:
  push:
    branches:
      - feature/rc1-session-identity
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner for RC1 bootstrap
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static and unit regression suite
        run: npm run check
      - name: RC1 browser critical paths
        run: npx playwright test
