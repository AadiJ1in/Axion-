name: RC1 fix Node-safe E2E seam

on:
  push:
    branches:
      - feature/rc1-session-identity

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[rc1-node-env-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rc1-session-identity
          fetch-depth: 0
      - name: Make import.meta.env access Node-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pose.js')
          s = p.read_text()
          old = 'if (import.meta.env.MODE === "e2e" && typeof window !== "undefined" && typeof window.__AXION_E2E_MOVEMENT_TRACKER_FACTORY__ === "function") {'
          new = 'if (import.meta.env?.MODE === "e2e" && typeof window !== "undefined" && typeof window.__AXION_E2E_MOVEMENT_TRACKER_FACTORY__ === "function") {'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit('Expected E2E seam not found')
          PY
          node --check src/pose.js
      - name: Commit fix
        run: |
          if git diff --quiet -- src/pose.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pose.js
          git commit -m "Make E2E seam safe outside Vite [rc1-node-env-fixed]"
          git push origin HEAD:feature/rc1-session-identity
