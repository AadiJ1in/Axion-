name: RC1 repair roadmap identity path

on:
  push:
    branches:
      - feature/rc1-session-identity
    paths:
      - .github/workflows/rc1-roadmap-e2e-repair-v2.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rc1-session-identity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded RC1 repair
        run: node scripts/rc1-repair-roadmap-and-e2e.mjs
      - name: Remove one-time repair helpers
        run: |
          rm -f .github/workflows/rc1-fix-roadmap-session-context.yml
          rm -f .github/workflows/rc1-roadmap-e2e-repair-v2.yml
          rm -f scripts/rc1-repair-roadmap-and-e2e.mjs
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner for RC1 bootstrap
        run: npm install --no-save @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static and unit regression suite
        run: npm run check
      - name: RC1 browser critical paths
        run: npx playwright test
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/main.js src/styles.css src/clinical-session-capture.js tests/e2e/rc1-critical.spec.js .github/workflows/rc1-fix-roadmap-session-context.yml .github/workflows/rc1-roadmap-e2e-repair-v2.yml scripts/rc1-repair-roadmap-and-e2e.mjs
          if git diff --cached --quiet; then
            echo "No verified changes to commit."
            exit 0
          fi
          git commit -m "Verify roadmap session identity end to end"
          git push origin HEAD:feature/rc1-session-identity
