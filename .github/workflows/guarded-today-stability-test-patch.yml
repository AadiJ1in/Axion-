name: Guarded Today stability test patch

on:
  push:
    branches:
      - hotfix/today-ui-stability-20260915

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/today-ui-stability-20260915
          fetch-depth: 0
      - name: Patch browser test context and discovery name
        run: node scripts/patch-today-stability-tests.mjs
      - name: Commit guarded test repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/rc1-critical.spec.js tests/e2e/rc1-today-stability.spec.js tests/e2e/today-stability.spec.js
          git diff --cached --quiet && { echo "No patch generated"; exit 1; }
          git commit -m "Run Today stability tests in Chromium and WebKit"
          git push origin HEAD:hotfix/today-ui-stability-20260915
