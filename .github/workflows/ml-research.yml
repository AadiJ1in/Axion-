name: ML research checks

on:
  pull_request:
    paths:
      - "ml/**"
      - "src/biomechanics.js"
      - "src/movement-quality-model.js"
      - "scripts/biomechanics-parity-json.mjs"
      - ".github/workflows/ml-research.yml"
  push:
    branches: [main]
    paths:
      - "ml/**"
      - "src/biomechanics.js"
      - "src/movement-quality-model.js"
      - "scripts/biomechanics-parity-json.mjs"
      - ".github/workflows/ml-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            ml/requirements-extraction.txt
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt -r ml/requirements-extraction.txt
      - name: Compile offline Python pipeline
        run: python -m py_compile ml/biomechanics_v1.py ml/mediapipe_model.py ml/download_pose_model.py ml/extract_mobiphysio_features.py ml/train_movement_quality.py ml/validate_research_artifact.py
      - name: Verify browser/offline feature parity
        run: python ml/test_biomechanics_parity.py
      - name: Verify browser/offline pose model identity
        run: python ml/test_model_config_sync.py
      - name: Verify MediaPipe extraction dependencies
        run: python -c "import cv2, mediapipe; print('MediaPipe extraction dependencies import successfully')"
      - name: Verify grouped training artifact
        run: python ml/test_training_pipeline.py
