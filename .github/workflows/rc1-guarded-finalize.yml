name: Guarded RC1 journey loop repair

on:
  push:
    branches:
      - feature/rc1-main-hardening-20260911
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/rc1-main-hardening-20260911
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Apply Recovery journey loop repair
        run: node scripts/rc1-journey-loop-fix.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run complete RC1 release gate
        run: npm run release:gate

      - name: Commit only verified loop repair
        run: |
          git config user.name "AadiJ1in"
          git config user.email "ajtexas2022@gmail.com"
          git add src/ui-hierarchy.js scripts/ui-hierarchy-test.mjs tests/e2e/rc1-critical.spec.js
          if git diff --cached --quiet; then
            echo "No journey loop changes to commit"
            exit 0
          fi
          git commit -m "Fix Recovery journey infinite render loop"
          git push origin HEAD:feature/rc1-main-hardening-20260911
