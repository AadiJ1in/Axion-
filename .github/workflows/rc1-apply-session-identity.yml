name: RC1 apply session identity patch

on:
  push:
    branches:
      - feature/rc1-session-identity
    paths:
      - scripts/rc1-apply-session-identity.mjs
      - .github/workflows/rc1-apply-session-identity.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[rc1-main-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rc1-session-identity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source transformation
        run: node scripts/rc1-apply-session-identity.mjs
      - name: Verify changed source parses
        run: node --check src/main.js && node --check src/session/session-context.js && node scripts/session-identity-test.mjs
      - name: Commit generated main.js change
        run: |
          if git diff --quiet -- src/main.js; then
            echo "No main.js change was produced." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "Enforce deterministic clinical session identity [rc1-main-applied]"
          git push origin HEAD:feature/rc1-session-identity
