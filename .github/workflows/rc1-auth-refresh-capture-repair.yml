name: RC1 repair auth refresh and capture races

on:
  push:
    branches:
      - feature/rc1-session-identity
    paths:
      - .github/workflows/rc1-auth-refresh-capture-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/rc1-session-identity
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded auth-refresh and capture repair
        run: node scripts/rc1-fix-auth-refresh-and-capture.mjs
      - name: Remove one-time repair helpers
        run: |
          rm -f .github/workflows/rc1-auth-refresh-capture-repair.yml
          rm -f scripts/rc1-fix-auth-refresh-and-capture.mjs
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static, unit, auth, and privacy regressions
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Full RC1 browser suite
        run: npx playwright test
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/clinic-readiness.js src/clinical-targets.js src/therapist-review-audit.js src/plan-version-history.js src/session-review-notes.js src/clinical-session-capture.js tests/e2e/fake-supabase-browser.js tests/e2e/rc1-critical.spec.js package.json scripts/auth-refresh-capture-test.mjs .github/workflows/rc1-auth-refresh-capture-repair.yml scripts/rc1-fix-auth-refresh-and-capture.mjs
          if git diff --cached --quiet; then
            echo "No verified changes to commit."
            exit 0
          fi
          git commit -m "Preserve active sessions across auth token refresh"
          git push origin HEAD:feature/rc1-session-identity
