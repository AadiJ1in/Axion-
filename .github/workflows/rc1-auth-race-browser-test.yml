name: RC1 verify auth race in browser

on:
  push:
    branches:
      - feature/rc1-session-identity
    paths:
      - .github/workflows/rc1-auth-race-browser-test.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/rc1-session-identity
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Add deterministic auth-race regression
        run: node scripts/rc1-add-auth-race-browser-test.mjs
      - name: Remove one-time helpers
        run: |
          rm -f .github/workflows/rc1-auth-race-browser-test.yml
          rm -f scripts/rc1-add-auth-race-browser-test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full static and unit gate
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Full RC1 browser suite including delayed logout race
        run: npx playwright test
      - name: Commit verified regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/e2e/fake-supabase-browser.js tests/e2e/rc1-critical.spec.js .github/workflows/rc1-auth-race-browser-test.yml scripts/rc1-add-auth-race-browser-test.mjs
          if git diff --cached --quiet; then
            echo "No verified changes to commit."
            exit 0
          fi
          git commit -m "Test delayed logout workspace isolation"
          git push origin HEAD:feature/rc1-session-identity
