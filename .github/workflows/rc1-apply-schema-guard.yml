name: RC1 apply schema compatibility patch

on:
  push:
    branches:
      - feature/rc1-session-identity
    paths:
      - scripts/rc1-apply-schema-guard.mjs
      - .github/workflows/rc1-apply-schema-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rc1-session-identity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source transformation
        run: node scripts/rc1-apply-schema-guard.mjs
      - name: Verify changed source parses
        run: node --check src/main.js && node --check src/portal.js && node --check src/release/schema-compatibility.js
      - name: Commit generated source changes
        run: |
          if git diff --quiet -- src/main.js src/portal.js; then
            echo "No source change was produced." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/portal.js
          git commit -m "Fail closed on incompatible RC1 schema [rc1-schema-applied]"
          git push origin HEAD:feature/rc1-session-identity
