name: RC1 fix roadmap session context

on:
  push:
    branches:
      - feature/rc1-session-identity
    paths:
      - .github/workflows/rc1-fix-roadmap-session-context.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rc1-session-identity
          fetch-depth: 0
      - name: Require verified context from roadmap exercise start
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text()
          old = '''  modal.querySelectorAll("[data-start-node-assignment]").forEach((button) => button.addEventListener("click", () => {
    currentRoadmapNode = node;
    currentAssignment = workspace.assignments.find((item) => item.id === button.dataset.startNodeAssignment) || null;
    modal.remove();
    if (currentAssignment) labView();
  }));'''
          new = '''  modal.querySelectorAll("[data-start-node-assignment]").forEach((button) => button.addEventListener("click", () => {
    currentRoadmapNode = node;
    currentAssignment = workspace.assignments.find((item) => item.id === button.dataset.startNodeAssignment) || null;
    modal.remove();
    if (!currentAssignment) {
      showSessionIdentityError(new SessionContextError(SESSION_CONTEXT_ERROR.MISMATCH));
      return;
    }
    if (currentSession?.demo) {
      labView();
      return;
    }
    try {
      beginVerifiedSessionContext(currentAssignment, node);
      labView();
    } catch (error) {
      showSessionIdentityError(error);
    }
  }));'''
          if old not in s:
              raise SystemExit('Expected roadmap assignment start block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check src/main.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "Create verified context from roadmap Start [rc1-roadmap-context-fixed]"
          git push origin HEAD:feature/rc1-session-identity
