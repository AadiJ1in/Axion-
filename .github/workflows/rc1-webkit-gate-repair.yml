name: RC1 WebKit release gate repair

on:
  push:
    branches:
      - feature/rc1-session-identity
    paths:
      - .github/workflows/rc1-webkit-gate-repair.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/rc1-session-identity
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Apply cross-browser release gate patch
        run: node scripts/rc1-webkit-gate-repair.mjs
      - name: Remove one-time repair helpers
        run: |
          rm -f .github/workflows/rc1-webkit-gate-repair.yml
          rm -f scripts/rc1-webkit-gate-repair.mjs
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.63.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Static and regression suite
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Chromium and WebKit RC1 browser suite
        run: npx playwright test
      - name: Commit verified cross-browser gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A playwright.config.js .github/workflows/rc1-e2e.yml .github/workflows/rc1-webkit-gate-repair.yml scripts/rc1-webkit-gate-repair.mjs
          if git diff --cached --quiet; then
            echo "No verified changes to commit."
            exit 0
          fi
          git commit -m "Add Chromium and WebKit RC1 release coverage"
          git push origin HEAD:feature/rc1-session-identity
