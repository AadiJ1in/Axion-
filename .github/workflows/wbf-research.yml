name: AxionWBF research gate

on:
  push:
    branches:
      - axionwbf-prototype
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wbf-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check WBF JavaScript syntax
        run: |
          node --check src/pose.js
          node --check src/whole-body-biomechanics.js
          node --check src/whole-body-compensation.js
          node --check src/whole-body-distribution.js
          node --check src/whole-body-distribution-v2.js
          node --check src/whole-body-compositional-statistics.js
          node --check src/whole-body-anatomical-balances.js
          node --check src/whole-body-angle-analysis.js
          node --check src/whole-body-live-angle.js
          node --check src/whole-body-live-asymmetry.js
          node --check src/whole-body-symptom-map.js
          node --check src/whole-body-bilateral-asymmetry.js
          node --check src/whole-body-bilateral-coordination.js
          node --check src/whole-body-asymmetry-view.js
          node --check src/whole-body-asymmetry-history.js
          node --check src/whole-body-noise-calibration.js
          node --check src/whole-body-noise-resolution.js
          node --check src/whole-body-noise-aware-asymmetry.js
          node --check src/whole-body-noise-gated-motion.js
          node --check src/whole-body-analysis-quality.js
          node --check src/whole-body-movement-intent.js
          node --check src/whole-body-motion-statistics.js
          node --check src/whole-body-region-ownership.js
          node --check src/whole-body-rep-distribution.js
          node --check src/whole-body-personalized-reference.js
          node --check src/whole-body-robust-evidence.js
          node --check src/whole-body-redistribution-history.js
          node --check src/whole-body-redistribution-evidence.js
          node --check src/whole-body-statistical-fingerprint.js
          node --check src/whole-body-statistical-fingerprint-v5.js
          node --check src/whole-body-statistical-fingerprint-v6.js
          node --check src/whole-body-statistical-fingerprint-v7.js
          node --check src/whole-body-statistical-fingerprint-v8.js
          node --check src/whole-body-statistical-fingerprint-v9.js
          node --check src/whole-body-longitudinal-fingerprint.js
          node --check src/whole-body-longitudinal-fingerprint-v2.js
          node --check src/whole-body-longitudinal-model-fingerprint.js
          node --check src/whole-body-tracker.js
          node --check src/whole-body-ui.js
          node --check src/whole-body-distribution-ui.js
          node --check src/whole-body-quality-model.js
          node --check ml/whole_body_landmarks_to_features.mjs
          node --check ml/export_wbf_fingerprint_table.mjs
          node --check ml/export_wbf_longitudinal_fingerprint_table.mjs
      - name: Run WBF contracts
        run: |
          node scripts/pose-world-landmarks-contract-test.mjs
          node scripts/whole-body-biomechanics-test.mjs
          node scripts/whole-body-compensation-test.mjs
          node scripts/whole-body-distribution-test.mjs
          node scripts/whole-body-region-ownership-test.mjs
          node scripts/whole-body-distribution-v2-test.mjs
          node scripts/whole-body-compositional-statistics-test.mjs
          node scripts/whole-body-anatomical-balances-test.mjs
          node scripts/whole-body-angle-analysis-test.mjs
          node scripts/whole-body-live-angle-test.mjs
          node scripts/whole-body-live-asymmetry-symptoms-test.mjs
          node scripts/wbf-app-integration-test.mjs
          node scripts/camera-runtime-test.mjs
          node scripts/whole-body-bilateral-asymmetry-test.mjs
          node scripts/whole-body-bilateral-coordination-test.mjs
          node scripts/whole-body-asymmetry-view-test.mjs
          node scripts/whole-body-asymmetry-history-test.mjs
          node scripts/whole-body-noise-calibration-test.mjs
          node scripts/whole-body-noise-resolution-test.mjs
          node scripts/whole-body-noise-aware-asymmetry-test.mjs
          node scripts/whole-body-noise-gated-motion-test.mjs
          node scripts/whole-body-analysis-quality-test.mjs
          node scripts/whole-body-movement-intent-test.mjs
          node scripts/whole-body-motion-statistics-test.mjs
          node scripts/whole-body-personalized-reference-test.mjs
          node scripts/whole-body-robust-evidence-test.mjs
          node scripts/whole-body-redistribution-history-test.mjs
          node scripts/whole-body-statistical-fingerprint-test.mjs
          node scripts/whole-body-statistical-fingerprint-v5-test.mjs
          node scripts/whole-body-statistical-fingerprint-v6-test.mjs
          node scripts/whole-body-statistical-fingerprint-v7-test.mjs
          node scripts/whole-body-statistical-fingerprint-v8-test.mjs
          node scripts/whole-body-statistical-fingerprint-v9-test.mjs
          node scripts/whole-body-longitudinal-fingerprint-test.mjs
          node scripts/whole-body-longitudinal-fingerprint-v2-test.mjs
          node scripts/whole-body-longitudinal-model-fingerprint-test.mjs
          node scripts/whole-body-quality-model-test.mjs
          node scripts/whole-body-ui-test.mjs
          node scripts/whole-body-distribution-ui-test.mjs
      - name: Check Python research pipeline syntax
        run: |
          python -m py_compile ml/extract_wbf_dataset_features.py
          python -m py_compile ml/train_wbf_movement_quality.py
          python -m py_compile ml/train_wbf_fingerprint_model.py
          python -m py_compile ml/train_wbf_fingerprint_model_v3.py
          python -m py_compile ml/run_wbf_fingerprint_trainer.py
          python -m py_compile ml/predict_wbf_fingerprint_model.py
          python -m py_compile ml/attach_wbf_feature_reference.py
          python -m py_compile ml/assess_wbf_release_readiness.py
          python -m py_compile ml/build_wbf_shadow_bundle.py
          python -m py_compile ml/verify_wbf_shadow_bundle.py
          python -m py_compile ml/test_wbf_release_readiness.py
          python -m py_compile ml/test_wbf_inference_ood_gate.py
          python -m py_compile ml/train_wbf_longitudinal_classifier.py
          python -m py_compile ml/smoke_wbf_longitudinal_classifier.py
          python -m py_compile ml/wbf_group_conformal.py
          python -m py_compile ml/wbf_regression_conformal.py
          python -m py_compile ml/test_wbf_group_conformal.py
          python -m py_compile ml/test_wbf_regression_conformal.py
          python -m py_compile ml/test_predict_wbf_fingerprint_model.py
          python -m py_compile ml/fit_wbf_longitudinal_conformal.py
          python -m py_compile ml/audit_wbf_fingerprint_features.py
          python -m py_compile ml/audit_wbf_clinician_labels.py
          python -m py_compile ml/audit_wbf_longitudinal_windows.py
          python -m py_compile ml/validate_wbf_longitudinal_feature_table.py
          python -m py_compile ml/evaluate_wbf_feature_ablation.py
          python -m py_compile ml/wbf_feature_families.py
          python -m py_compile ml/test_wbf_feature_families.py
          python -m py_compile ml/generate_wbf_trainer_smoke_fixture.py
          python -m py_compile ml/assert_wbf_trainer_smoke.py
      - name: Run participant-balanced trainer and deployment-bundle smoke
        run: |
          python -m pip install --disable-pip-version-check --quiet -r ml/requirements-trainer.txt
          python ml/test_wbf_feature_families.py
          python ml/test_wbf_regression_conformal.py
          python ml/test_predict_wbf_fingerprint_model.py
          PYTHONPATH=ml python ml/test_wbf_release_readiness.py
          PYTHONPATH=ml python ml/test_wbf_inference_ood_gate.py
          python ml/generate_wbf_trainer_smoke_fixture.py --output /tmp/wbf-trainer-smoke.csv
          python ml/audit_wbf_fingerprint_features.py \
            --features-csv /tmp/wbf-trainer-smoke.csv \
            --output /tmp/wbf-feature-audit.json \
            --min-pairwise-n 5
          PYTHONPATH=ml python ml/run_wbf_fingerprint_trainer.py \
            --features-csv /tmp/wbf-trainer-smoke.csv \
            --output /tmp/wbf-trainer-smoke.json \
            --model-output /tmp/wbf-trainer-smoke.joblib \
            --model-families ridge \
            --min-groups 8 \
            --inner-folds 2 \
            --outer-folds 3 \
            --logo-max-groups 0 \
            --bootstrap-reps 30 \
            --null-permutations 3 \
            --min-fingerprint-coverage 0.8
          python ml/assert_wbf_trainer_smoke.py --artifact /tmp/wbf-trainer-smoke.json
          PYTHONPATH=ml python ml/attach_wbf_feature_reference.py \
            --model /tmp/wbf-trainer-smoke.joblib \
            --features-csv /tmp/wbf-trainer-smoke.csv
          PYTHONPATH=ml python ml/predict_wbf_fingerprint_model.py \
            --model /tmp/wbf-trainer-smoke.joblib \
            --features-csv /tmp/wbf-trainer-smoke.csv \
            --output /tmp/wbf-smoke-predictions.csv
          PYTHONPATH=ml python ml/assess_wbf_release_readiness.py \
            --artifact /tmp/wbf-trainer-smoke.json \
            --output /tmp/wbf-shadow-readiness.json \
            --mode research_shadow \
            --min-participants 8 \
            --min-folds 3 \
            --min-relative-participant-mae-improvement 0.0 \
            --max-null-fraction-at-or-below-observed 1.0 \
            --coverage-tolerance 0.20
          PYTHONPATH=ml python ml/build_wbf_shadow_bundle.py \
            --model /tmp/wbf-trainer-smoke.joblib \
            --evaluation /tmp/wbf-trainer-smoke.json \
            --readiness /tmp/wbf-shadow-readiness.json \
            --output-dir /tmp/wbf-shadow-bundle
          PYTHONPATH=ml python ml/verify_wbf_shadow_bundle.py \
            --bundle-dir /tmp/wbf-shadow-bundle
          python ml/test_wbf_group_conformal.py
          python ml/smoke_wbf_longitudinal_classifier.py
      - name: Run existing Axion regressions
        run: npm run check
      - name: Build current application
        run: npm run build
