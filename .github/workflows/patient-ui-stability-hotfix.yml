name: Guarded patient UI stability hotfix

on:
  push:
    branches:
      - hotfix/patient-ui-stability-20260913
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: hotfix/patient-ui-stability-20260913
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Apply patient UI stability repair
        run: |
          node scripts/fix-patient-hotfix-script.mjs
          node scripts/patient-ui-stability-hotfix.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run complete RC1 release gate
        run: npm run release:gate

      - name: Commit only verified product repair
        run: |
          git config user.name "AadiJ1in"
          git config user.email "ajtexas2022@gmail.com"
          rm -f scripts/patient-ui-stability-hotfix.mjs scripts/fix-patient-hotfix-script.mjs .github/workflows/patient-ui-stability-hotfix.yml
          git add src/main.js src/ui-hierarchy.js src/patient-game-polish.js src/ui-stability.js src/ui-stability.css scripts/ui-hierarchy-test.mjs tests/e2e/rc1-critical.spec.js package.json scripts/patient-ui-stability-hotfix.mjs scripts/fix-patient-hotfix-script.mjs .github/workflows/patient-ui-stability-hotfix.yml
          if git diff --cached --quiet; then
            echo "No verified UI stability changes to commit"
            exit 0
          fi
          git commit -m "Stabilize patient navigation and story surfaces"
          git push origin HEAD:hotfix/patient-ui-stability-20260913
